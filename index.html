<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seshat - World Building Tool for Novel Authors</title>
    <meta name="description" content="Seshat helps fiction authors organize characters, timelines, locations, and lore in one place." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://seshat.pages.dev" />
    <script>
      (function () {
        try {
          const stored = localStorage.getItem("seshat-theme");
          const isDark = stored === "dark" || (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          const theme = isDark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
          
          // Inject immediate background styling to prevent white flash before stylesheets are loaded
          const bg = isDark ? "#141312" : "#fdfcfb";
          const color = isDark ? "#eceae8" : "#2b2927";
          const style = document.createElement("style");
          style.id = "seshat-theme-fallback";
          style.innerHTML = `html, body { background-color: ${bg}; color: ${color}; }`;
          document.head.appendChild(style);
        } catch (e) {}
      })();
    </script>
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Seshat – World Building Tool for Novel Authors" />
    <meta property="og:description" content="Seshat helps fiction authors organize characters, timelines, locations, and lore in one place." />
    <meta property="og:url" content="https://seshat.pages.dev" />
    <meta property="og:site_name" content="Seshat" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Seshat – World Building Tool for Novel Authors" />
    <meta name="twitter:description" content="Seshat helps fiction authors organize characters, timelines, locations, and lore in one place." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
